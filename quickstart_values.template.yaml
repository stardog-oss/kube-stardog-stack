# Template values for kube-stardog-stack on AKS with Envoy Gateway.
#
# Copy this file to cluster_values.yaml and replace the example values for your cluster.
# The domains below assume the chart creates:
#   - https://sparql.example.com
#   - https://launchpad.example.com
#
# Install flow:
#   1. Install cert-manager, Gateway API CRDs, and Envoy Gateway.
#   2. Install Stardog once with these values to create the Gateway.
#   3. Get the Gateway public IP and create DNS A records for both hostnames.
#   4. Re-run the Stardog Helm install so cert-manager can issue certificates.
#   5. If Voicebox connects to HTTPS endpoints signed by a private CA, create
#      the CA bundle Secret and enable voicebox.customCaBundle below.

global:
  stardog:
    enabled: true
  launchpad:
    enabled: true
  voicebox:
    enabled: true

  gateway:
    enabled: true
    createGateway: true

    # Name of the Gateway object created in the Envoy Gateway namespace.
    name: stardog-gateway # example: stardog-envoy-gateway

    # Must be the namespace where the Envoy Gateway controller runs.
    namespace: envoy-gateway

    # Base DNS domain. The chart uses launchpad.<domain> and sparql.<domain>.
    domain: example.com # example: example.com

    # Listener section names. These must match the Gateway listeners created by
    # this chart. The ACME solvers below must use the HTTP listener names.
    sparqlSectionName: sparql
    sparqlHttpSectionName: sparql-http
    launchpadSectionName: launchpad
    launchpadHttpSectionName: launchpad-http

    tls:
      enabled: true
      sparqlSecretName: sparql-example-com-tls # example: sparql-example-com-tls
      launchpadSecretName: launchpad-example-com-tls # example: launchpad-example-com-tls

  certIssuer:
    enabled: true

    # Required because the Gateway and TLS secrets are in envoy-gateway while
    # the Helm release is installed in stardog-ns.
    clusterScoped: true
    type: acme
    acme:
      email: platform@example.com # example: platform@example.com

      # Use Let's Encrypt staging for tests to avoid production rate limits:
      # https://acme-staging-v02.api.letsencrypt.org/directory
      server: https://acme-v02.api.letsencrypt.org/directory

      # HTTP-01 challenges must attach to port-80 Gateway listeners. Do not use
      # the HTTPS listener names here because those listeners need certificates
      # before they can become ready.
      solvers:
        - selector:
            dnsNames:
              - sparql.example.com
          http01:
            gatewayHTTPRoute:
              parentRefs:
                - name: stardog-gateway
                  namespace: envoy-gateway
                  kind: Gateway
                  sectionName: sparql-http
        - selector:
            dnsNames:
              - launchpad.example.com
          http01:
            gatewayHTTPRoute:
              parentRefs:
                - name: stardog-gateway
                  namespace: envoy-gateway
                  kind: Gateway
                  sectionName: launchpad-http

stardog:
  cluster:
    # Set true and increase replicaCount for clustered Stardog deployments.
    enabled: false
    replicaCount: 1

  image:
    registry: docker.io # example: myregistry.azurecr.io or docker.io
    repository: stardog/stardog
    tag: "12.1.2" # example: "12.1.2"

  upgrade:
    approval:
      # Must exactly match stardog.image.tag when approving automatic upgrade.
      targetVersion: "12.1.2"

  resources:
    requests:
      cpu: "2" # example: "2"
      memory: "4Gi" # example: "4Gi"
    limits:
      cpu: "4" # example: "4"
      memory: "8Gi" # example: "8Gi"

  jvm:
    minHeap: "2g" # example: "2g"
    maxHeap: "4g" # example: "4g"
    directMem: "1g" # example: "1g"

  # Optional: uncomment if Stardog should run only on labeled nodes.
  # nodeSelector:
  #   <NODE_LABEL_KEY>: <NODE_LABEL_VALUE>

  # Optional: uncomment if Stardog nodes are tainted.
  # tolerations:
  #   - key: <TAINT_KEY>
  #     value: <TAINT_VALUE>
  #     effect: NoSchedule

  jwtConfig:
    # Enable when integrating with an identity provider.
    enabled: false
    issuers:
      - roleMappingSource: token
        usernameTemplates:
          - "{preferred_username}"
          - "{sub}"
        autoCreateUsers: true
        rolesClaimPath: roles
        algorithms:
          - name: RS256

launchpad:
  image:
    registry: docker.io
    repository: stardog/launchpad
    tag: "v4.0.0" # example: "v4.0.0"

  # For Azure Key Vault CSI or synced Kubernetes Secrets, prefer envFrom/extraEnv
  # instead of placing sensitive values directly in this file.
  # envFrom:
  #   - secretRef:
  #       name: launchpad-runtime-env
  #
  # serviceAccount:
  #   annotations:
  #     azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  # podLabels:
  #   azure.workload.identity/use: "true"

  environmentVariables:
    FRIENDLY_NAME: Stardog Applications # example: Stardog Applications

    # Optional shared local login for test environments only.
    SHARED_USER_AUTH_ENABLED: "false"
    # SHARED_USER_USERNAME: <SHARED_USER_USERNAME>
    # SHARED_USER_PASSWORD: <SHARED_USER_PASSWORD>

    # Optional identity-provider flags.
    # AZURE_AUTH_ENABLED: "true"

voicebox:
  image:
    registry: docker.io
    repository: stardog/voicebox-service
    tag: "v1.0.0" # must be a Voicebox Service v1.0.0+ image

  # Leave command empty so the chart uses the image default ENTRYPOINT/CMD.
  command: []

  # Voicebox Service v1.0.0+ uses frame storage. The readiness probe checks
  # /system/storage-ready, so local storage must be writable.
  replicaCount: 1
  frameStore:
    enabled: true
    backend: local
    local:
      path: /var/lib/voicebox/frames
      size: 20Gi
      storageClassName: "" # example for AKS: managed-csi

  # If Stardog or another HTTPS endpoint uses a private CA, create a Secret:
  #
  # kubectl -n <NAMESPACE> create secret generic voicebox-ca-bundle \
  #   --from-file=ca-bundle.crt=/path/to/complete-ca-bundle.pem
  #
  # Then enable this block. Do not set REQUESTS_CA_BUNDLE/SSL_CERT_FILE manually
  # without mounting the file.
  # customCaBundle:
  #   enabled: true
  #   existingSecret: voicebox-ca-bundle
  #   key: ca-bundle.crt
  #   mountPath: /etc/ssl/custom/ca-bundle.crt

  # For Azure Key Vault CSI or synced Kubernetes Secrets, prefer envFrom/extraEnv
  # instead of placing API keys directly in this file.
  # envFrom:
  #   - secretRef:
  #       name: voicebox-runtime-env
  #
  # serviceAccount:
  #   annotations:
  #     azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  # podLabels:
  #   azure.workload.identity/use: "true"

  environmentVariables:
    VBX_CONFIG_FILE: /voicebox-config/vbx_config.json
    TMPDIR: /tmp
    PRODUCTION: "1"
    # For quick tests only. For production, provide this from a Secret using
    # voicebox.envFrom or voicebox.extraEnv.
    # AZURE_API_KEY: <AZURE_OPENAI_API_KEY>

  configFile: |
    {
      "agent_selection_type": "llm",
      "enable_lineage": true,
      "enable_external_llm": true,
      "enable_analytics": true,
      "enable_charts": true,
      "use_agents_automatically": false,
      "default_llm_config": {
        "llm_provider": "azure",
        "llm_name": "gpt-4o",
        "server_url": "https://example-ai.services.ai.azure.com/models"
      },
      "query_kg_config": {
        "generate_query_config": {
          "llm_config": {
            "max_tokens": 7000
          }
        }
      }
    }
