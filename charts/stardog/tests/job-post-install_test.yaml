
suite: Validate Stardog Init Job
templates:
- job-post-install.yaml
tests:
# Test for Stardog Job Creation
- it: should create a Stardog initialization job when Stardog is enabled
  values:
    - values/values-stardog.yaml
  set:
    securityContext:
      runAsUser: 1000
    image:
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: stardog/stardog
      tag: latest
    ports:
      server: "5820"
  asserts:
  - isKind:
      of: Job
  - equal:
      path: metadata.name
      value: stardog-RELEASE-NAME
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 1000
  - equal:
      path: spec.template.spec.containers[0].imagePullPolicy
      value: IfNotPresent

# Test Image Pull Secrets
- it: should correctly use image pull secrets if provided
  values:
    - values/values-stardog.yaml
  set:
    image:
      username: "stardog_user"
      password: "stardog_pass"
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets[0].name
      value: "RELEASE-NAME-image-pull-secret"

- it: should mount the chart's own password secret by default
  values:
    - values/values-stardog.yaml
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].secret.secretName
      value: stardog-RELEASE-NAME-password
  - equal:
      path: spec.template.spec.volumes[0].secret.items[0].key
      value: password

- it: should mount an existing secret when admin.existingSecretName is set
  values:
    - values/values-stardog.yaml
  set:
    admin:
      existingSecretName: custom-admin-secret
      existingSecretKey: adminpw
    global:
      skipSecretValidation: true
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].secret.secretName
      value: custom-admin-secret
  - equal:
      path: spec.template.spec.volumes[0].secret.items[0].key
      value: adminpw

- it: fails when admin.existingSecretName is set but the secret doesn't exist
  values:
    - values/values-stardog.yaml
  set:
    admin:
      existingSecretName: custom-admin-secret
  asserts:
  - failedTemplate:
      errorMessage: "Secret NAMESPACE/custom-admin-secret not found. Please create it or choose an existing secret."
