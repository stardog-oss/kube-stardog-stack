
suite: Validate Stardog Init Job
templates:
- job-post-install.yaml
tests:
- it: places explicit and generated pull secrets in the pod spec
  set:
    image.pullSecrets:
      - name: private-registry
    image.username: registry-user
    image.password: registry-password
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets
      value:
        - name: private-registry
        - name: RELEASE-NAME-image-pull-secret
  - notExists:
      path: spec.imagePullSecrets

- it: uses the configured cluster domain for hook connectivity
  set:
    clusterDomain: example.internal
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HOST
        value: stardog-RELEASE-NAME.NAMESPACE.svc.example.internal

- it: keeps tracing off before expanding backup credentials
  set:
    backup.enabled: true
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: '^\{ set \+x; \} 2>/dev/null\nset -e\n'
  - notMatchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: 'set -[^\n]*x'
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: 'backup_credentials "\$\{PROTOCOL\}://\$\{HOST\}:\$\{PORT\}" "\$\{BACKUP_USERNAME\}" "\$\{BACKUP_PASSWORD\}"'
  - notMatchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: 'echo[^\n]*\$\{?(PASSWORD|ADMIN_PASSWORD|NEW_PW)'
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: '(?m)^change_pw [^\n]+ \|\| exit 1$'
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: '(?m)^backup_credentials [^\n]+ \|\| exit 1$'

# Test for Stardog Job Creation
- it: should create a Stardog initialization job when Stardog is enabled
  values:
    - values/values-stardog.yaml
  set:
    securityContext:
      runAsUser: 1000
    image:
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: stardog/stardog
      tag: latest
    ports:
      server: "5820"
  asserts:
  - isKind:
      of: Job
  - equal:
      path: metadata.name
      value: stardog-RELEASE-NAME
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 1000
  - equal:
      path: spec.template.spec.containers[0].imagePullPolicy
      value: IfNotPresent

# Test Image Pull Secrets
- it: should correctly use image pull secrets if provided
  values:
    - values/values-stardog.yaml
  set:
    image:
      username: "stardog_user"
      password: "stardog_pass"
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets[0].name
      value: "RELEASE-NAME-image-pull-secret"

- it: should mount the chart's own password secret by default
  values:
    - values/values-stardog.yaml
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].secret.secretName
      value: stardog-RELEASE-NAME-password
  - equal:
      path: spec.template.spec.volumes[0].secret.items[0].key
      value: password

- it: should mount an existing secret when admin.existingSecretName is set
  values:
    - values/values-stardog.yaml
  set:
    admin:
      existingSecretName: custom-admin-secret
      existingSecretKey: adminpw
    global:
      skipSecretValidation: true
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].secret.secretName
      value: custom-admin-secret
  - equal:
      path: spec.template.spec.volumes[0].secret.items[0].key
      value: adminpw

- it: fails when admin.existingSecretName is set but the secret doesn't exist
  values:
    - values/values-stardog.yaml
  set:
    admin:
      existingSecretName: custom-admin-secret
  asserts:
  - failedTemplate:
      errorMessage: "Secret NAMESPACE/custom-admin-secret not found. Please create it or choose an existing secret."
