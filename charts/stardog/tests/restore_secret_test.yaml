suite: Restore-only credential Secrets
values:
  - values/values-stardog.yaml
templates:
  - secret.yaml
tests:
  - it: creates an S3 restore Secret independently from backup
    set:
      image.tag: 12.2.1
      backup.enabled: false
      restore:
        enabled: true
        id: s3-backup-11
        source:
          type: s3
          path: backups
          backupId: "11"
          nodeId: 881a39ca-cb9e-49eb-ba30-f99efac9ccf7
          s3:
            bucketName: stardog-cmc-training
            region: us-east-1
            accessKey: test-access
            secretKey: test-secret
        safety:
          confirmEmptyVolumes: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-restore-s3-secret
    asserts:
      - equal:
          path: data.accessKey
          value: dGVzdC1hY2Nlc3M=
      - equal:
          path: data.secretKey
          value: dGVzdC1zZWNyZXQ=

  - it: does not create an S3 restore Secret when an existing Secret is selected
    set:
      image.tag: 12.2.1
      restore:
        enabled: true
        id: s3-backup-11
        source:
          type: s3
          path: backups
          backupId: "11"
          nodeId: 881a39ca-cb9e-49eb-ba30-f99efac9ccf7
          s3:
            bucketName: stardog-cmc-training
            region: us-east-1
            credentialsSecret: external-s3-secret
        safety:
          confirmEmptyVolumes: true
    asserts:
      - hasDocuments:
          count: 1

  - it: creates an Azure restore Secret independently from backup
    set:
      image.tag: 12.2.1
      backup.enabled: false
      restore:
        enabled: true
        id: azure-backup-10
        source:
          type: azure
          path: backups
          backupId: "10"
          azure:
            accountName: restoreaccount
            containerName: restore-container
            accountKey: test-key
        safety:
          confirmEmptyVolumes: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-restore-azure-secret
    asserts:
      - equal:
          path: data.accountname
          value: cmVzdG9yZWFjY291bnQ=
      - equal:
          path: data.accountkey
          value: dGVzdC1rZXk=
