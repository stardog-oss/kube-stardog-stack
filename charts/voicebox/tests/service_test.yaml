suite: Test Voicebox Service
values:
  - values/values-voicebox.yaml
templates:
  - service.yaml

tests:
  - it: should render only the traffic service by default
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: Service
      - documentIndex: 0
        equal:
          path: metadata.name
          value: voicebox-RELEASE-NAME

  - it: should render a headless service for StatefulSet
    set:
      workload:
        type: StatefulSet
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 1
        isKind:
          of: Service
      - documentIndex: 1
        equal:
          path: metadata.name
          value: voicebox-RELEASE-NAME-headless
      - documentIndex: 1
        equal:
          path: spec.clusterIP
          value: None
