suite: Voicebox SecretProviderClass
templates:
  - secretproviderclass.yaml
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a variable Azure Key Vault SecretProviderClass
    set:
      secretProviderClass:
        enabled: true
        name: voicebox-keyvault
        annotations:
          example.com/source: keyvault
        secretObjects:
          - secretName: voicebox-runtime-env
            type: Opaque
            data:
              - objectName: OPENAI-API-KEY
                key: OPENAI_API_KEY
              - objectName: GOOGLE-CREDENTIALS
                key: GOOGLE_CREDENTIALS
        parameters:
          usePodIdentity: "false"
          useVMManagedIdentity: "false"
          keyvaultName: voicebox-vault
          tenantId: tenant-id
          objects: |
            array:
              - |
                objectName: OPENAI-API-KEY
                objectType: secret
              - |
                objectName: GOOGLE-CREDENTIALS
                objectType: secret
    asserts:
      - isKind:
          of: SecretProviderClass
      - equal:
          path: metadata.name
          value: voicebox-keyvault
      - equal:
          path: metadata.annotations["example.com/source"]
          value: keyvault
      - equal:
          path: spec.provider
          value: azure
      - equal:
          path: spec.secretObjects[0].secretName
          value: voicebox-runtime-env
      - contains:
          path: spec.secretObjects[0].data
          content:
            objectName: OPENAI-API-KEY
            key: OPENAI_API_KEY
      - contains:
          path: spec.secretObjects[0].data
          content:
            objectName: GOOGLE-CREDENTIALS
            key: GOOGLE_CREDENTIALS
      - equal:
          path: spec.parameters.keyvaultName
          value: voicebox-vault
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: GOOGLE-CREDENTIALS"
