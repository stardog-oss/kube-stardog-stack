{{- include "voicebox.validate" . -}}
{{- $frameStore := .Values.frameStore | default (dict) -}}
{{- $frameStoreBackend := include "voicebox.frameStoreBackend" . -}}
{{- $frameStoreLocal := $frameStore.local | default (dict) -}}
{{- if and $frameStore.enabled (eq $frameStoreBackend "local") (eq (include "voicebox.workloadType" .) "Deployment") (not $frameStoreLocal.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "voicebox.frameStorePvcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdcommon.labels.standard" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml ($frameStoreLocal.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  resources:
    requests:
      storage: {{ $frameStoreLocal.size | default "20Gi" }}
  {{- if $frameStoreLocal.storageClassName }}
  storageClassName: {{ $frameStoreLocal.storageClassName | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.bitesService.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.bitesService.sparkApplication.persistentVolumeClaim.name | default "voicebox-bites-docs-pvc" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdcommon.labels.standard" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: {{ .Values.bitesService.sparkApplication.persistentVolumeClaim.size }}
  {{- if .Values.bitesService.sparkApplication.persistentVolumeClaim.storageClassName }}
  storageClassName: {{ .Values.bitesService.sparkApplication.persistentVolumeClaim.storageClassName | quote}}
  {{- end }}
{{- end }}
