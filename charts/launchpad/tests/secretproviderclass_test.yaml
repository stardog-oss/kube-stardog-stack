suite: Launchpad SecretProviderClass
templates:
  - secretproviderclass.yaml
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a variable Azure Key Vault SecretProviderClass
    set:
      secretProviderClass:
        enabled: true
        name: launchpad-keyvault
        annotations:
          example.com/source: keyvault
        secretObjects:
          - secretName: launchpad-runtime-env
            type: Opaque
            data:
              - objectName: AZURE-CLIENT-ID
                key: AZURE_CLIENT_ID
              - objectName: AZURE-CLIENT-SECRET
                key: AZURE_CLIENT_SECRET
        parameters:
          usePodIdentity: "false"
          useVMManagedIdentity: "false"
          keyvaultName: launchpad-vault
          tenantId: tenant-id
          objects: |
            array:
              - |
                objectName: AZURE-CLIENT-ID
                objectType: secret
              - |
                objectName: AZURE-CLIENT-SECRET
                objectType: secret
    asserts:
      - isKind:
          of: SecretProviderClass
      - equal:
          path: metadata.name
          value: launchpad-keyvault
      - equal:
          path: metadata.annotations["example.com/source"]
          value: keyvault
      - equal:
          path: spec.provider
          value: azure
      - equal:
          path: spec.secretObjects[0].secretName
          value: launchpad-runtime-env
      - contains:
          path: spec.secretObjects[0].data
          content:
            objectName: AZURE-CLIENT-ID
            key: AZURE_CLIENT_ID
      - contains:
          path: spec.secretObjects[0].data
          content:
            objectName: AZURE-CLIENT-SECRET
            key: AZURE_CLIENT_SECRET
      - equal:
          path: spec.parameters.keyvaultName
          value: launchpad-vault
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: AZURE-CLIENT-SECRET"
