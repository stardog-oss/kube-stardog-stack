suite: Test Launchpad ServiceAccount
values:
  - values/values-launchpad.yaml
templates:
  - service_account.yaml

tests:
  - it: should create a ServiceAccount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: launchpad-RELEASE-NAME

  - it: should render service account annotations
    set:
      serviceAccount:
        annotations:
          azure.workload.identity/client-id: client-id-123
    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: client-id-123

  - it: should use configured service account name
    set:
      serviceAccount:
        name: launchpad-workload-identity
    asserts:
      - equal:
          path: metadata.name
          value: launchpad-workload-identity

  - it: should skip ServiceAccount creation when disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
